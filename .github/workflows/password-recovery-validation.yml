name: Password recovery validation

on:
  push:
    branches:
      - fix/password-recovery-flow
    paths:
      - "frontend/src/api/supabaseAuth.ts"
      - "frontend/src/pages/ResetPassword.tsx"
      - "frontend/src/App.tsx"
      - "frontend/functions/api/edge/auth/**"
      - "frontend/package-lock.json"
      - ".github/workflows/password-recovery-validation.yml"
  pull_request:
    branches:
      - fix/cloudflare-pages-tests-1.44.79
    paths:
      - "frontend/src/api/supabaseAuth.ts"
      - "frontend/src/pages/ResetPassword.tsx"
      - "frontend/src/App.tsx"
      - "frontend/functions/api/edge/auth/**"
      - "frontend/package-lock.json"
      - ".github/workflows/password-recovery-validation.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
