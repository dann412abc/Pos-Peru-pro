name: Validar frontend POS

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/validate-frontend.yml'
  push:
    branches:
      - 'fix/cloudflare-pages-types-1.44.78'
    paths:
      - 'frontend/**'
      - '.github/workflows/validate-frontend.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Build y pruebas frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar TypeScript y Vite
        run: npm run build
      - name: Ejecutar pruebas frontend
        run: npm test -- --reporter=dot
      - name: Validar proxy de Pages
        run: npm run test:pages-proxy
