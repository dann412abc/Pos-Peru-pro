name: POS branch validation

on:
  push:
    branches:
      - work/returns-register-1.44.79
    paths:
      - "frontend/**"
      - "supabase/migrations-preview/**"
      - "supabase/tests/**"
      - "docs/**"
      - "backend/package.json"
      - ".github/workflows/pos-branch-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: work/returns-register-1.44.79
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Report exact npm dependency vulnerabilities and safe fixes
        working-directory: frontend
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs -e '
            const a=require("/tmp/npm-audit.json");
            console.log("AUDIT_SUMMARY", JSON.stringify(a.metadata?.vulnerabilities || {}));
            for (const [name,v] of Object.entries(a.vulnerabilities || {})) {
              const via=(v.via || []).map(x => typeof x === "string" ? x : ({name:x.name,title:x.title,range:x.range,url:x.url}));
              console.log("AUDIT_PACKAGE", JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via}));
            }
          '
          npm audit fix --dry-run --json > /tmp/npm-audit-fix.json || true
          node --input-type=commonjs -e '
            const a=require("/tmp/npm-audit-fix.json");
            console.log("AUDIT_FIX_DRY_RUN", JSON.stringify({added:a.added,removed:a.removed,changed:a.changed,audit:a.audit?.metadata?.vulnerabilities || a.metadata?.vulnerabilities || null}));
          '
      - name: Validate cash register contracts
        working-directory: frontend
        run: npm run test:cash-contract
      - name: Validate returns, refunds and cash integration
        working-directory: frontend
        run: npm run test:returns-contract
      - name: Validate purchase receipt contracts
        working-directory: frontend
        run: npm run test:purchases-contract
      - name: Validate purchase to sale FEFO flow
        working-directory: frontend
        run: npm run test:purchase-sales-flow
      - name: Validate purchase staging harness safety
        working-directory: frontend
        run: node --test ../supabase/tests/purchase-staging-harness.test.mjs ../supabase/tests/purchase-receipt-staging.integration.test.mjs
      - name: Validate sales staging harness safety and purchase-to-sale flow
        working-directory: frontend
        run: node --test ../supabase/tests/sales-staging-harness.test.mjs ../supabase/tests/sales-transaction-staging.integration.test.mjs
      - name: Validate returns staging harness safety
        working-directory: frontend
        run: node --test ../supabase/tests/returns-staging-harness.test.mjs ../supabase/tests/returns-transaction-staging.integration.test.mjs
      - name: Validate returns to cash UI integration
        working-directory: frontend
        run: node --test functions/api/edge/returns-cash-ui-integration-contract.test.mjs
      - name: Run focused Edge routing smoke tests
        working-directory: frontend
        run: npm run test:edge-smoke
      - name: Test Supabase returns API adapter
        working-directory: frontend
        run: npx vitest run src/api/supabaseReturns.test.ts
      - name: Test Supabase cash reconciliation adapter
        working-directory: frontend
        run: npx vitest run src/api/supabaseCash.test.ts
      - name: Validate cash register UI integration contract
        working-directory: frontend
        run: node --test tests/contracts/cash-ui-integration-contract.test.mjs
      - name: Validate POS Supabase catalog UI contract
        working-directory: frontend
        run: node --test tests/contracts/pos-supabase-catalog-ui-contract.test.mjs
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
