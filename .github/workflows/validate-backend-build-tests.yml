name: Validar compilación y pruebas backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/src/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig*.json"
      - "backend/jest.config.js"
      - ".github/workflows/validate-backend-build-tests.yml"
  push:
    branches: ["fix/cloudflare-pages-types-1.44.78"]
    paths:
      - "backend/src/**"
      - "backend/package.json"
      - "backend/package-lock.json"
      - "backend/tsconfig*.json"
      - "backend/jest.config.js"
      - ".github/workflows/validate-backend-build-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Compilar y probar backend NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias bloqueadas
        run: npm ci
      - name: Compilar backend
        run: npm run build
      - name: Ejecutar pruebas unitarias
        run: npm test -- --runInBand
